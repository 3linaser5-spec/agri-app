name: agri_app
description: تطبيق نباتي - المستشار الزراعي الذكي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_app_check: any
  google_generative_ai: any
  http: any
  image_picker: any
  geolocator: any
  url_launcher: any
  flutter_tts: any

  # ✅ إشعارات
  firebase_messaging: any
  flutter_local_notifications: any
  timezone: any
  flutter_timezone: any

  # ✅ PDF - Syncfusion لدعم عربي ممتاز
  syncfusion_flutter_pdf: ^26.2.14
  path_provider: any

  # ✅ أدوات
  shared_preferences: any
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/
    - assets/images/
    - assets/data/
  
  # ✅ الخط العربي للـ PDF
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
