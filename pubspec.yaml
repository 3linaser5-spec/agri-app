name: agri_app
description: تطبيق نباتي - المستشار الزراعي الذكي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ✅ Firebase (محدثة)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_app_check: ^0.4.0
  firebase_messaging: ^16.0.0

  # ✅ AI
  google_generative_ai: ^0.4.7

  # ✅ الشبكة
  http: ^1.2.2
  dio: ^5.7.0

  # ✅ الصور والموقع
  image_picker: ^1.1.2
  geolocator: ^14.0.0

  # ✅ الأدوات
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.0
  share_plus: ^11.0.0
  shared_preferences: ^2.5.0
  package_info_plus: ^9.0.0
  open_filex: ^4.5.0
  permission_handler: ^12.0.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.2
  sqflite: ^2.4.1

  # ✅ الإشعارات
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0

  # ✅ PDF - Syncfusion (مؤقت)
  syncfusion_flutter_pdf: ^28.0.0
  path_provider: ^2.1.5

  # ✅ أدوات إضافية
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/
    - assets/images/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
