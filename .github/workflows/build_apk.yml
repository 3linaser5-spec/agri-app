name: Build Flutter APK

on:
  push:
    branches: [ main, "رئيسي" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Setup Android Project and Permissions
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          
          sed -i '/- assets\/data\//d' /tmp/pubspec.yaml
          
          flutter create --no-pub --org com.dahshory.agri --project-name agri_app .
          
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

          # زرع كود Firebase App Check Debug Token تلقائياً داخل MainActivity.kt
          mkdir -p android/app/src/main/kotlin/com/dahshory/agri/agri_app
          cat << 'EOF' > android/app/src/main/kotlin/com/dahshory/agri/agri_app/MainActivity.kt
          package com.dahshory.agri.agri_app

          import android.content.Context
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  val prefs = applicationContext.getSharedPreferences(
                      "com.google.firebase.appcheck.debug.store",
                      Context.MODE_PRIVATE
                  )
                  prefs.edit().putString(
                      "com.google.firebase.appcheck.debug.DEBUG_SECRET",
                      "08128BB7-E7D4-4073-8C93-BA16BDCE1642"
                  ).apply()
                  super.onCreate(savedInstanceState)
              }
          }
          EOF
          
          rm -f android/build.gradle
          rm -f android/settings.gradle
          
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip
          EOF
          
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          
          sed -i 's/android:label="agri_app"/android:label="نباتي"/' android/app/src/main/AndroidManifest.xml
          
          sed -i 's|</application>|<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" \/>\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"\/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"\/>\n                <action android:name="android.intent.action.QUICKBOOT_POWERON"\/>\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"\/>\n            <\/intent-filter>\n        <\/receiver>\n    <\/application>|' android/app/src/main/AndroidManifest.xml
          
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return
