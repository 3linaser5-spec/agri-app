name: Signing key setup (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Manual setup only
        run: |
          echo "This workflow intentionally does not generate, encode, print, or upload a signing key."
          echo "Create and protect the keystore on an owner-controlled machine, then save its values in GitHub Secrets."
          echo "See docs/ANDROID_SIGNING_SETUP.md for the required secret names and rotation guidance."
