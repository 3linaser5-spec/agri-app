name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore agri-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias agri_key \
            -storepass agri123456 \
            -keypass agri123456 \
            -dname "CN=Agri App, OU=Development, O=Agri, L=Cairo, S=Cairo, C=EG"

      - name: Encode to Base64
        run: |
          base64 agri-release-key.jks > keystore-base64.txt
          echo "--- KEYSTORE GENERATED SUCCESSFULLY ---"
          wc -c agri-release-key.jks

      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            agri-release-key.jks
            keystore-base64.txt
