name: Analyze

on:
  push:
    branches-ignore: [ gh-pages ]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # التحليل ما بيوقّفش الـ job هنا؛ بنحوّل النتائج لـ annotations الأول
      # وبعدين آخر خطوة بتفشّل الـ job لو فيه أخطاء أو تحذيرات.
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-pub > analyze.txt 2>&1 || touch analyze.failed
          cat analyze.txt

      # GitHub بيعرض 10 أخطاء + 10 تحذيرات فقط لكل خطوة، فنقسّم على 3 خطوات
      - name: Annotate problems (1-10)
        if: always()
        run: python3 .github/scripts/annotate_analyze.py analyze.txt 0

      - name: Annotate problems (11-20)
        if: always()
        run: python3 .github/scripts/annotate_analyze.py analyze.txt 1

      - name: Annotate problems (21-30)
        if: always()
        run: python3 .github/scripts/annotate_analyze.py analyze.txt 2

      # الاختبارات بتتشغّل بعد التحليل. النتيجة JSON بنحوّلها لـ annotations
      # (أخطاء الاختبارات وأخطاء تجميع ملفات الاختبار) عشان تتقري من غير اللوج.
      - name: Test
        run: |
          flutter test --no-pub --reporter json > test.json 2>&1 || touch test.failed

      - name: Annotate test failures
        if: always()
        run: |
          if [ -f test.json ]; then python3 .github/scripts/annotate_tests.py test.json; fi

      - name: Fail if the analyzer or the tests found problems
        run: |
          status=0
          if [ -f analyze.failed ]; then
            echo "flutter analyze reported errors or warnings (see annotations above)"
            status=1
          fi
          if [ -f test.failed ]; then
            echo "flutter test failed (see annotations above)"
            status=1
          fi
          exit $status
